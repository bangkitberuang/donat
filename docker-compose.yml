services:
  donat-app:
    build: .
    container_name: donat-app
    restart: always
    volumes:
      - ./public:/app/public
      - ./server.js:/app/server.js
      - ./cookies.txt:/app/cookies.txt
    environment:
      - PORT=3000
    networks:
      - coolify

networks:
  coolify:
    external: true
